<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEU Grievance Support</title>

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --text: #e5e7eb;
      --line: #243042;
      --blue: #2563eb;
      --green: #15803d;
      --green-soft: #052e1a;
      --red: #b91c1c;
      --status-bg: #0f1b33;
      --status-line: #29406b;
      --status-text: #dbeafe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #0f1b33 0%, #0b1220 38%, #08101c 100%);
      color: var(--text);
      line-height: 1.4;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px;
    }

    .card {
      background: rgba(17, 24, 39, 0.97);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    h1,
    h2 {
      margin: 0 0 8px;
    }

    h1 {
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1.2;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    h2 {
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 14px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: #f8fafc;
      background: #0f172a;
      outline: none;
      -webkit-text-fill-color: #f8fafc;
      caret-color: #f8fafc;
      appearance: none;
      opacity: 1;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-text-fill-color: #f8fafc !important;
      caret-color: #f8fafc;
      -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
      box-shadow: 0 0 0 1000px #0f172a inset !important;
      transition: background-color 9999s ease-in-out 0s;
      border: 1px solid var(--line);
    }

    input::placeholder {
      color: #7b8aa6;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      text-align: center;
      line-height: 1.2;
      white-space: normal;
      word-break: break-word;
      transition: transform 0.08s ease, opacity 0.08s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.95;
    }

    .download-btn {
      background: var(--red);
      color: #fff;
    }

    .grievance-btn {
      background: var(--blue);
      color: #fff;
    }

    .status {
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      margin-top: 10px;
      background: var(--status-bg);
      border: 1px solid var(--status-line);
      color: var(--status-text);
      word-break: break-word;
    }

    .ok {
      background: var(--green-soft);
      border-color: #166534;
      color: #bbf7d0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      .grid,
      .btns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>BEU Grievance Support</h1>
    </div>

    <div class="card">
      <h2>Student details</h2>

      <div class="grid">
        <div>
          <label for="regNo">Registration number</label>
          <input
            id="regNo"
            type="text"
            placeholder="Example: 23104108010"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          />
        </div>

        <div id="nameWrapper">
          <label for="studentName">Student name</label>
          <input
            id="studentName"
            type="text"
            placeholder="Type your name manually"
            autocomplete="off"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
          />
        </div>

        <div id="collegeWrapper" style="grid-column: 1 / -1;">
          <label for="college">College</label>
          <input
            id="college"
            type="text"
            placeholder="College auto-filled from registration number"
            autocomplete="off"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="btns">
        <button class="download-btn" id="downloadBtn">Step 2: Download PDF Evidence</button>
        <button class="grievance-btn" id="grievanceMailBtn">Step 3: Open Grievance Mail</button>
      </div>

      <div class="status" id="lookupStatus">Enter registration number. College will auto-fill.</div>
      <div class="status" id="downloadStatus">Download the PDF first, then attach it manually in the mail app.</div>
      <div class="status hidden" id="mailStatus"></div>
    </div>
  </div>

  <script>
    const TO = [
      'beubihar@gmail.com',
      'supremecourt@nic.in',
      'letterpetition@sci.nic.in',
      'pil.english@sci.nic.in',
      'cji.office@sci.nic.in',
      'pkmishra.pmo@gov.in',
      'us.petitions@rb.nic.in',
      'secypg@nic.in',
      'pgappeal509@gmail.com',
      'vermarachna.ugc@nic.in',
      'ssiwach.ugc@nic.in',
      'sulugc@gmail.com',
      'registrar.beu@bihar.gov.in',
      'pgofficer@dpg.gov.in',
      'vcm@aicte-india.org',
      'pubgrv@aicte-india.org',
      'pgportal-ugc@gov.in',
      'ugcgrievance@gmail.com',
      'cmbihar-bih@nic.in',
      'cmbihar@nic.in',
      'ms@aicte-india.org'
    ];

    const CC = [
      'complaint@aicte-india.org',
      'helpdesk1@aicte-india.org',
      'ps.dst.bihar@gmail.com',
      'secy-edn-bih@nic.in',
      'splsecretary.edn@gmail.com',
      'ssabihar@gmail.com',
      'publicgrievances-bih@gov.in',
      'info-Lokshikayat-bih@gov.in',
      'us.petitions@rb.nic.in',
      'secy.president@rb.nic.in',
      'nhrcga@nic.in',
      'secypg@nic.in',
      'jscpg-mha@nic.in',
      'pgofficer@dpg.gov.in',
      'complaint.nhrc@nic.in',
      'rticell-vps@gov.in',
      'bhrc-bih@nic.in',
      'ugc.technical@nic.in'
    ];

    const GRIEVANCE_SUBJECT_GENERIC =
      'URGENT: Time-Bound Review and Recalculation of Wrongly Penalized Backlog Results of Approx. 3400+ Students';

    const PDF_PATH = 'files/Representation_Annexures_and_Evidence_BEU_Result_13-03-2026.pdf';
    const PENALTY_TXT_PATH = 'data/penalty_calc_output.txt';
    const COLLEGE_CODES_PATH = 'data/college_codes.json';
    const DRIVE_EVIDENCE_LINK = 'https://drive.google.com/drive/folders/1xGCZeNrOJB46nLCybNsu0bsqoCESkVdw';
    const RESULT_HOME_URL = 'https://beu-bih.ac.in/result-one';

    let penaltyRows = null;
    let COLLEGE_BY_CODE = {};

    const regNoEl = document.getElementById('regNo');
    const studentNameEl = document.getElementById('studentName');
    const collegeEl = document.getElementById('college');
    const lookupStatusEl = document.getElementById('lookupStatus');
    const downloadStatusEl = document.getElementById('downloadStatus');
    const mailStatusEl = document.getElementById('mailStatus');

    const downloadBtn = document.getElementById('downloadBtn');
    const grievanceMailBtn = document.getElementById('grievanceMailBtn');

    function showMailStatus(message, ok = false) {
      mailStatusEl.classList.remove('hidden');
      mailStatusEl.textContent = message;
      mailStatusEl.className = ok ? 'status ok' : 'status';
    }

    async function loadCollegeCodes() {
      try {
        const res = await fetch(COLLEGE_CODES_PATH);

        if (!res.ok) {
          throw new Error(`College code file HTTP ${res.status}`);
        }

        COLLEGE_BY_CODE = await res.json();

        lookupStatusEl.textContent = 'College code list loaded. Enter registration number.';
        lookupStatusEl.className = 'status ok';
      } catch (error) {
        console.error('Could not load college codes:', error);

        lookupStatusEl.textContent = 'College code list not loaded. Type college manually.';
        lookupStatusEl.className = 'status';
      }
    }

    function getCollegeCodeFromRegNo(regNo) {
      const cleanReg = regNo.trim();

      if (cleanReg.length < 8) {
        return '';
      }

      return cleanReg.slice(5, 8);
    }

    function autoFillCollegeFromRegNo() {
      const regNo = regNoEl.value.trim();
      const collegeCode = getCollegeCodeFromRegNo(regNo);
      const collegeName = COLLEGE_BY_CODE[collegeCode];

      if (!regNo) {
        lookupStatusEl.textContent = 'Enter registration number. College will auto-fill.';
        lookupStatusEl.className = 'status';
        saveData();
        return;
      }

      if (collegeName) {
        collegeEl.value = collegeName;
        lookupStatusEl.textContent = `College auto-filled using code ${collegeCode}.`;
        lookupStatusEl.className = 'status ok';
      } else {
        lookupStatusEl.textContent = `College code ${collegeCode || 'not found'} not found. Type college manually.`;
        lookupStatusEl.className = 'status';
      }

      saveData();
    }

    function loadSavedData() {
      const savedReg = localStorage.getItem('beu_reg');
      const savedName = localStorage.getItem('beu_name');
      const savedCollege = localStorage.getItem('beu_col');

      if (savedReg) regNoEl.value = savedReg;
      if (savedName) studentNameEl.value = savedName;
      if (savedCollege) collegeEl.value = savedCollege;

      autoFillCollegeFromRegNo();
    }

    function saveData() {
      localStorage.setItem('beu_reg', regNoEl.value);
      localStorage.setItem('beu_name', studentNameEl.value);
      localStorage.setItem('beu_col', collegeEl.value);
    }

    regNoEl.addEventListener('input', autoFillCollegeFromRegNo);
    studentNameEl.addEventListener('input', saveData);
    collegeEl.addEventListener('input', saveData);

    async function loadPenaltyRows() {
      if (penaltyRows) return penaltyRows;

      try {
        const res = await fetch(PENALTY_TXT_PATH);

        if (!res.ok) {
          throw new Error(`Penalty file HTTP ${res.status}`);
        }

        const text = await res.text();
        const lines = text
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(Boolean);

        if (lines.length < 2) {
          penaltyRows = [];
          return penaltyRows;
        }

        const rows = [];

        for (let i = 1; i < lines.length; i++) {
          const parts = lines[i].split('|').map(s => s.trim());

          if (parts.length < 14) continue;

          rows.push({
            reg_no: parts[0],
            branch_code: parts[1],
            penalized_subject_codes: parts[2],
            subject_names: parts[3],
            old_shown_grades: parts[4],
            new_shown_grades: parts[5],
            should_be_grades: parts[6],
            shown_sgpa: parts[7],
            corrected_sgpa: parts[8],
            shown_cgpa: parts[9],
            corrected_cgpa: parts[10],
            status: parts[11],
            old_result_url: parts[12],
            new_result_url: parts[13]
          });
        }

        penaltyRows = rows;
        return rows;
      } catch (error) {
        console.error('Could not load penalty data:', error);
        penaltyRows = [];
        return [];
      }
    }

    async function findPenaltyMatches(regNo) {
      const rows = await loadPenaltyRows();
      const cleanRegNo = regNo.trim();
      return rows.filter(row => row.reg_no === cleanRegNo);
    }

    function signBlock(studentName, regNo, college) {
      return college
        ? `${studentName}\nRegistration No.: ${regNo}\n${college}`
        : `${studentName}\nRegistration No.: ${regNo}`;
    }

    function getExamDetailsFromUrl(url) {
      const safeUrl = url || '';

      if (safeUrl.includes('4th+Semester')) {
        return 'B.Tech. 4th Semester Examination, 2025 | Session: 2023-27 | Exam Held: December/2025 | Result Published: 20/03/2026';
      }

      if (safeUrl.includes('2nd+Semester')) {
        return 'B.Tech. 2nd Semester Examination, 2025 (Old) | Session: 2023-27 (YBL) | Exam Held: November/2025 | Result Published: 13/03/2026';
      }

      if (safeUrl.includes('1st+Semester')) {
        return 'B.Tech. 1st Semester Examination, 2025 (Old) | Session: 2023-27 (YBL) | Exam Held: January/2026 | Result Published: 23/05/2026';
      }

      return 'Backlog / Semester Examination Result';
    }

    function formatCommaText(value, upper = false) {
      const text = value || '';

      return text
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => upper ? s.toUpperCase() : s)
        .join(', ');
    }

    function makeAffectedResultBlock(matches) {
      if (!matches || matches.length === 0) {
        return '';
      }

      const resultBlocks = matches.map((match, index) => {
        const examDetails = getExamDetailsFromUrl(match.new_result_url);

        const formattedSubjects = formatCommaText(match.subject_names, true);
        const formattedSubjectCodes = formatCommaText(match.penalized_subject_codes);
        const formattedPublishedGrades = formatCommaText(match.new_shown_grades);
        const formattedCorrectGrades = formatCommaText(match.should_be_grades);

        return `MY AFFECTED RESULT DATA ${matches.length > 1 ? '(' + (index + 1) + ')' : ''}

Examination:
${examDetails}

Registration No.:
${match.reg_no}

Affected Subject Code(s):
${formattedSubjectCodes}

Affected Subject(s):
${formattedSubjects}

Published Grade(s):
${formattedPublishedGrades}

Correct Grade(s) Should Be:
${formattedCorrectGrades}

Published SGPA / CGPA:
${match.shown_sgpa} / ${match.shown_cgpa}

Corrected SGPA / CGPA:
${match.corrected_sgpa} / ${match.corrected_cgpa}`;
      }).join('\n\n');

      return `${resultBlocks}\n\n`;
    }

    function makePersonalAffectedMail(matches = []) {
      const studentName = (studentNameEl.value || '________________').trim();
      const regNo = (regNoEl.value || '________________').trim();
      const college = (collegeEl.value || '').trim();
      const sign = signBlock(studentName, regNo, college);
      const affectedBlock = makeAffectedResultBlock(matches);

      return `Respected Sir/Madam,

I am writing to report a serious and continuing error in the backlog result computation under Bihar Engineering University, Patna.

My result data, as identified from the affected-student penalty database, shows that the superseded one-step backlog penalty has been applied to my published result.

${affectedBlock}The core issue is that after Notice No. 232 dated 12.03.2026, the revised regulations were made applicable with immediate effect to presently studying students. Under revised Clause 5.7, backlog evaluation is based on the latest examination and previous internal assessment. The earlier one-step-lower backlog penalty is not continued in the revised provision.

Despite this, the published backlog results still show penalized grades instead of the correct earned grades. This has directly reduced SGPA/CGPA and caused academic loss.

This is not an isolated issue. The same penalty error affects approximately 3400+ students across the following results:

1. B.Tech. 2nd Semester Examination, 2025 (Old)
Session: 2023-27 (YBL)
Exam Held: November/2025
Result Published: 13/03/2026

2. B.Tech. 4th Semester Examination, 2025
Session: 2023-27
Exam Held: December/2025
Result Published: 20/03/2026

3. B.Tech. 1st Semester Examination, 2025 (Old)
Session: 2023-27 (YBL)
Exam Held: January/2026
Result Published: 23/05/2026

A formal representation with annexures and evidence was already submitted earlier, but students have not received any clear correction, republication, or written clarification. This continued delay is causing serious academic prejudice to thousands of students.

Supporting evidence, affected student data, and result comparison records are available here:
${DRIVE_EVIDENCE_LINK}

Official BEU result portal for verification:
${RESULT_HOME_URL}

Therefore, I respectfully request the competent authorities to:

1. Immediately verify the result-processing logic used in the above backlog results.
2. Recalculate and republish all affected results where the old one-step penalty has been applied.
3. Correct my published grade(s), SGPA, and CGPA as per the revised rules.
4. Issue a written clarification explaining which backlog rule was used after Notice No. 232.
5. Direct the IT / Result Processing Cell to remove the superseded penalty logic from all affected, pending, and future result calculations.
6. Provide a time-bound response, as students have already waited for a long time.

The students are not asking for any favour. We are only requesting correct implementation of the University's own revised rules.

Enclosure:
Representation_Annexures_and_Evidence_BEU_Result_13-03-2026.pdf

Yours faithfully,

${sign}`;
    }

    function makeGeneralSupportMail() {
      const studentName = (studentNameEl.value || '________________').trim();
      const regNo = (regNoEl.value || '________________').trim();
      const college = (collegeEl.value || '').trim();
      const sign = signBlock(studentName, regNo, college);

      return `Respected Sir/Madam,

I am writing to support and escalate the unresolved grievance regarding wrongly penalized backlog results under Bihar Engineering University, Patna.

A serious issue has been raised by affected students regarding the continued application of the superseded one-step-lower backlog penalty even after Notice No. 232 dated 12.03.2026.

The matter may kindly be viewed in the following clear manner:

■ The Old Rule (Clause 5.6):
Previously, if a student passed a backlog paper, the final grade was reduced by one step below the grade actually earned.

■ The New Rule (Notice No. 232 and Clause 5.7):
On 12.03.2026, the University issued Notice No. 232 directing that the revised UG Regulations apply with immediate effect to all current students. Under revised Clause 5.7, backlog evaluation is based on the latest examination and previous internal assessment. The earlier one-step-lower penalty no longer continues in the revised provision.

■ The Error in Result Processing:
Despite the revised framework taking immediate effect, the affected backlog-related results appear to have been processed using the earlier penal logic. This has caused wrongful grade reduction, SGPA/CGPA depression, academic uncertainty, and serious prejudice to approximately 3400+ students.

The affected result categories include:

1. B.Tech. 2nd Semester Examination, 2025 (Old)
Session: 2023-27 (YBL)
Exam Held: November/2025
Result Published: 13/03/2026

2. B.Tech. 4th Semester Examination, 2025
Session: 2023-27
Exam Held: December/2025
Result Published: 20/03/2026

3. B.Tech. 1st Semester Examination, 2025 (Old)
Session: 2023-27 (YBL)
Exam Held: January/2026
Result Published: 23/05/2026

This is not a minor calculation issue. A wrongful one-grade reduction can directly affect SGPA, CGPA, academic record, scholarship eligibility, placement shortlisting, internship opportunities, and future academic progression.

A formal representation with annexures and evidence was already submitted earlier, but students have not received any clear correction, republication, or written clarification. The continued silence is causing mass academic prejudice and loss of confidence among students.

Supporting evidence, affected student data, and result comparison records are available here:
${DRIVE_EVIDENCE_LINK}

Official BEU result portal for verification:
${RESULT_HOME_URL}

Therefore, I respectfully request the competent authorities to:

1. Immediately review the result-processing logic used in the above backlog-related results.
2. Verify whether the old one-step-lower penalty was applied after Notice No. 232 dated 12.03.2026.
3. Recalculate and republish all affected results wherever the superseded penalty has been used.
4. Issue a written clarification explaining which backlog rule was used after Notice No. 232.
5. Direct the IT / Result Processing Cell to remove the superseded penalty logic from all affected, pending, and future result calculations.
6. Provide a time-bound response to prevent further academic harm to students.

The students are not asking for any favour. We are only requesting correct implementation of the University's own revised rules and fair recomputation of affected results.

Enclosure:
Representation_Annexures_and_Evidence_BEU_Result_13-03-2026.pdf

Yours faithfully,

${sign}`;
    }

    async function downloadPdf() {
      downloadStatusEl.textContent = 'Starting download...';
      downloadStatusEl.className = 'status';

      try {
        const response = await fetch(PDF_PATH);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'Representation_Annexures_and_Evidence_BEU_Result_13-03-2026.pdf';

        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        downloadStatusEl.textContent = 'Download started. Attach the PDF manually in the mail app.';
        downloadStatusEl.className = 'status ok';
      } catch (err) {
        console.error(err);
        downloadStatusEl.textContent = 'Download failed. Check the PDF file path and try again.';
        downloadStatusEl.className = 'status';
      }
    }

    function normalizeEmailText(text) {
      return text
        .replace(/\r?\n/g, '\r\n')
        .replace(/\r\n{3,}/g, '\r\n\r\n')
        .trim();
    }

    async function copyBodyToClipboard(subject, body) {
      const fullText = `Subject: ${subject}\n\n${body}`;

      try {
        await navigator.clipboard.writeText(fullText);
        return true;
      } catch (err) {
        console.warn('Clipboard copy failed:', err);
        return false;
      }
    }

    async function openMail(subject, body) {
      saveData();

      const fullBody = normalizeEmailText(body);
      const copied = await copyBodyToClipboard(subject, fullBody);

      const fullMailto =
        `mailto:${encodeURIComponent(TO.join(','))}` +
        `?cc=${encodeURIComponent(CC.join(','))}` +
        `&subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(fullBody)}`;

      const fallbackBody = normalizeEmailText(
        `Respected Sir/Madam,

This is an urgent request for time-bound review and recalculation of wrongly penalized backlog results of approximately 3400+ affected students after Notice No. 232 dated 12.03.2026.

The full detailed grievance email has been copied to clipboard. If the complete text is not visible here, please paste it manually in this mail body.

Supporting evidence folder:
${DRIVE_EVIDENCE_LINK}

Official BEU result portal:
${RESULT_HOME_URL}

Please also find the PDF evidence manually attached by the student.

Regards`
      );

      const fallbackMailto =
        `mailto:${encodeURIComponent(TO.join(','))}` +
        `?cc=${encodeURIComponent(CC.join(','))}` +
        `&subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(fallbackBody)}`;

      if (copied) {
        showMailStatus(
          'Full grievance copied and opening mail app. If Gmail cuts body, paste the copied full email manually.',
          true
        );
      } else {
        showMailStatus(
          'Opening mail app. Clipboard copy failed, but full body will be tried in mail app.',
          false
        );
      }

      if (fullMailto.length < 14000) {
        window.location.href = fullMailto;
      } else {
        window.location.href = fallbackMailto;
      }
    }

    downloadBtn.addEventListener('click', downloadPdf);

    grievanceMailBtn.addEventListener('click', async () => {
      const regNo = regNoEl.value.trim();

      try {
        const matches = regNo ? await findPenaltyMatches(regNo) : [];

        if (matches.length > 0) {
          openMail(GRIEVANCE_SUBJECT_GENERIC, makePersonalAffectedMail(matches));
        } else {
          openMail(GRIEVANCE_SUBJECT_GENERIC, makeGeneralSupportMail());
        }
      } catch (err) {
        console.error(err);
        openMail(GRIEVANCE_SUBJECT_GENERIC, makeGeneralSupportMail());
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await loadCollegeCodes();
      loadSavedData();
    });
  </script>
</body>
</html>
